apiVersion: apps/v1
kind: Deployment
metadata:
  name: insecure-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insecure-web
  template:
    metadata:
      labels:
        app: insecure-web
    spec:
      containers:
        - name: web
          image: {{ .Values.image }}
          securityContext:
            privileged: true
