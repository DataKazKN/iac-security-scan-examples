    <text x="64" y="126" fill="#f4f6f8" font-size="42" font-weight="750">Terraform misconfiguration findings</text>
    <text x="64" y="162" fill="#9da6b2" font-size="18">Pinned public fixture · normalized Checkov results · no source code exposed</text>

    <rect x="1084" y="64" width="252" height="48" rx="24" fill="#122a20" stroke="#2d7a57"/>
    <text x="1210" y="95" fill="#7ee0b0" font-size="14" font-weight="700" text-anchor="middle">COMPLETED_WITH_FINDINGS</text>

    <g>
