      <text x="90" y="258" fill="#ff929e" font-size="34" font-weight="760">FAIL</text>
      <text x="90" y="286" fill="#9da6b2" font-size="15">Policy gate decision</text>
    </g>
    <g>
      <rect x="500" y="208" width="400" height="106" rx="14" fill="#14181e" stroke="#2a3039"/>
      <text x="526" y="258" fill="#f4f6f8" font-size="34" font-weight="760">8</text>
      <text x="526" y="286" fill="#9da6b2" font-size="15">Failed policies in the Dataset</text>
    </g>
    <g>
      <rect x="936" y="208" width="400" height="106" rx="14" fill="#14181e" stroke="#2a3039"/>
      <text x="962" y="258" fill="#f4f6f8" font-size="34" font-weight="760">0</text>
      <text x="962" y="286" fill="#9da6b2" font-size="15">Rows truncated</text>
