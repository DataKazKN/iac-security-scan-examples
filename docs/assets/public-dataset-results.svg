        <text x="90" y="446" fill="#d8dee9" font-family="SFMono-Regular, Consolas, monospace">CKV_AWS_144</text>
        <text x="270" y="446" fill="#a9c3ff">GENERAL_SECURITY</text>
        <text x="480" y="446" fill="#edf0f3">Ensure that S3 bucket has cross-region replication enabled</text>
        <text x="1088" y="446" fill="#d8dee9" font-family="SFMono-Regular, Consolas, monospace">main.tf:1</text>
