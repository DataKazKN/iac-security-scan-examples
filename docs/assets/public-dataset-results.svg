<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title description">
  <title id="title">Real normalized Terraform findings from the public Apify Dataset</title>
  <desc id="description">Five of eight failed Checkov policies from the public Terraform example, including policy IDs, categories, file locations, and failed results.</desc>
  <rect width="1400" height="780" fill="#0b0d10"/>
  <rect x="0" y="0" width="1400" height="10" fill="#6f86ff"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
